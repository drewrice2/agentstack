[package]
name = "agentstack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI for packaging, installing, and sharing reusable AI agent skills"
authors = ["Drew <drewrice2@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/drewrice2/agentstack"
publish = false
default-run = "agentstack"

[workspace]
members = [".", "registry"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "agentstack"
path = "src/main.rs"

[lib]
name = "agentstack"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "5.0"
flate2 = "1.0"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
url = "2"
webbrowser = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
assert_fs = "1.1"
predicates = "3.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
